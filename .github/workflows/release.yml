name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write 
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Read the version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check that the tag matches package.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "Release tag $TAG does not match package.json version $VERSION." >&2
            echo "Bump the version with 'npm version' before tagging, so the footer" >&2
            echo "and the release cannot disagree." >&2
            exit 1
          fi

      - run: npm test
      - run: npm run check

      - name: Build the portable package
        run: BASE_PATH=./ npm run build

      - name: Zip the package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp README.md LICENSE NOTICE dist/
          cd dist
          zip -qr "../dzif-coredataset-edcselector-$VERSION.zip" .
          cd ..
          unzip -l "dzif-coredataset-edcselector-$VERSION.zip" | tail -3

      - name: Attach the package to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "dzif-coredataset-edcselector-$VERSION.zip" --clobber

      - name: Build for GitHub Pages
        if: vars.DEPLOY_PAGES == 'true'
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build

      - uses: actions/configure-pages@v6
        if: vars.DEPLOY_PAGES == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: vars.DEPLOY_PAGES == 'true'
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: package
    if: vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  image:
    needs: package 
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=raw,value=dev,enable=${{ github.event_name == 'workflow_dispatch' }}


      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
