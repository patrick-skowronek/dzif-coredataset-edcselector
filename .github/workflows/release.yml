name: Release

# Runs only when a release is published (plus a manual button for dry runs), so a
# free account spends a couple of Actions minutes per release instead of per push.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # attach the package to the release
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Read the version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check that the tag matches package.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "Release tag $TAG does not match package.json version $VERSION." >&2
            echo "Bump the version with 'npm version' before tagging, so the footer" >&2
            echo "and the release cannot disagree." >&2
            exit 1
          fi

      - run: npm test
      - run: npm run check

      # The downloadable package uses relative asset paths, so it works from any
      # folder on any web server. The Pages build needs the /<repository>/ prefix.
      - name: Build the portable package
        run: BASE_PATH=./ npm run build

      - name: Zip the package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp README.md LICENSE NOTICE dist/
          cd dist
          zip -qr "../dzif-coredataset-edcselector-$VERSION.zip" .
          cd ..
          unzip -l "dzif-coredataset-edcselector-$VERSION.zip" | tail -3

      - name: Attach the package to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "dzif-coredataset-edcselector-$VERSION.zip" --clobber

      - name: Build for GitHub Pages
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          # Artifacts share a storage quota with Packages, so keep them briefly.
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
