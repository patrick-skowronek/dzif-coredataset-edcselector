server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The ODM files are ~1.9 MB each and compress to a fraction of that, so gzip
    # matters more here than for a typical static site.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json text/xml application/xml image/svg+xml text/plain;

    # index.html, app.js and app.css keep stable names across releases, so they have
    # to be revalidated rather than cached.
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-cache";
    }

    # A version of the core dataset never changes — its id is part of the file name.
    location ~* ^/odm/.+\.xml$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # The manifest gains an entry whenever a version is added.
    location = /odm/versions.json {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
